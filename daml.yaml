# 설정 항목 레퍼런스: https://docs.canton.network/
sdk-version: 3.5.5
name: canton-daml-playground
source: daml
version: 0.1.1


dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script

build-options:
  # 템플릿과 테스트 스크립트를 한 패키지에 두고 있어서 나는 경고.
  # 실서비스 패키지라면 테스트를 별도 패키지로 분리해 daml-script 가 참가자 노드에
  # 업로드되지 않게 해야 하지만, 연습용 단일 패키지에서는 의도된 구성이다.
  - -Wno-template-interface-depends-on-daml-script
